<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<style>
  :root { color-scheme: light dark; --fg:#14213d; --bg:#fff; --muted:#5b6475; --accent:#0a6cff; }
  @media (prefers-color-scheme: dark) { :root { --fg:#eef1f7; --bg:#0d1220; --muted:#9aa3b5; --accent:#6aa9ff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.55 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { max-width:44rem; margin:0 auto; padding:2rem 1.25rem 4rem; }
  h1 { font-size:1.9rem; line-height:1.2; margin:.2rem 0 .4rem; }
  h2 { font-size:1.2rem; margin-top:2rem; }
  p, li { color:var(--fg); } .muted { color:var(--muted); font-size:.95rem; }
  a { color:var(--accent); } nav a { margin-right:1rem; } nav { margin-bottom:1.5rem; }
  .button { display:inline-block; background:var(--accent); color:#fff; padding:.8rem 1.4rem; border-radius:.7rem; text-decoration:none; font-weight:600; }
</style>
</head>
<body><main>
<nav><a href="/">{{ app_name }}</a><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a><a href="/support/">Support</a></nav>
{% block content %}{% endblock %}
</main></body></html>
