name: Android CI

# This workflow is authored for the standalone JetSetter_Android repository, where this
# android/ folder is the repository ROOT. It activates automatically once you export with
# push-to-jetsetter-android.sh. (While the project lives inside jetsetter-pro as a subfolder,
# GitHub does not run workflows from sub-directories, so it stays dormant there.)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jetsetter-pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
