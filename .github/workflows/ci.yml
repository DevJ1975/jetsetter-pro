name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend tests (Django)
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  test:
    name: Build + unit tests (iOS Simulator)
    runs-on: xcode-27
    # Deployment target is iOS 26; iOS 27 features are @available-gated and
    # need the iOS 27 SDK, so CI builds with Xcode 27.1 on GitHub's Xcode 27
    # image (preview label as of 2026-10).
    # The shared "JetSetter Pro" scheme builds the app + widget extension and
    # runs the JetSetter ProTests bundle (Swift Testing).
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - name: Xcode version
        run: xcodebuild -version
      - name: Build and test (Debug, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project "JetSetter Pro.xcodeproj" \
            -scheme "JetSetter Pro" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            test
