name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    # The runner needs an Xcode with the iOS 26 SDK (the app @available-gates
    # FoundationModels / iOS-26 APIs); latest-stable currently provides it.
    # Once a unit-test target + shared TestAction exist, change `build` to `test`.
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Xcode version
        run: xcodebuild -version
      - name: Build (Debug, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project "JetSetter Pro.xcodeproj" \
            -scheme "JetSetter Pro" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
