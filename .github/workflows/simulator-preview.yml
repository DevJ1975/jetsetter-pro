name: Simulator preview

# Builds the app for the iOS simulator, runs it with the demo trip, and uploads
# screenshots, a walkthrough video and the simulator .app as an artifact.
# Runs on demand, or on a push to a claude/ branch whose commit message
# contains [simulator].

on:
  workflow_dispatch:
  push:
    branches: [ 'claude/**' ]

jobs:
  preview:
    name: Simulator screenshots
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[simulator]')
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - name: Build for the simulator (Debug, demo mode on)
        run: |
          set -o pipefail
          xcodebuild \
            -project "JetSetter Pro.xcodeproj" \
            -scheme "JetSetter Pro" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -25
      - name: Capture screenshots and video
        run: bash Scripts/simulator-preview.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-preview
          path: preview/
          retention-days: 14
